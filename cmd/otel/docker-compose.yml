name: otel-demo

# 默认形态：应用直接把 OTLP 发给单容器后端 otel-lgtm，链路里没有 collector。
#   docker compose up -d --build
# 想看 collector 在链路中间的样子，用 override 文件：
#   docker compose -f docker-compose.yml -f docker-compose.collector.yml up -d --build

services:
  # 一体化后端：Grafana + Tempo + Prometheus + Loki + Pyroscope
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "13000:3000" # Grafana
      - "24317:4317" # OTLP gRPC（本机调试用）
      - "24318:4318" # OTLP HTTP
      - "14040:4040" # Pyroscope
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms256m
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # 一次性建 topic，替代原来 k8s 里的 kafka-init Job
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 1 --replication-factor 1; do sleep 2; done
    restart: "no"

  order-service:
    build:
      context: ..
      dockerfile: otel/Dockerfile
      args:
        SERVICE_DIR: service-a
    environment:
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      SERVICE_VERSION: dev
      DEPLOY_ENV: local
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: orders
      INVENTORY_URL: http://inventory-service:8080
      PORT: "8080"
      PPROF_ADDR: ":6060"
    ports:
      - "18080:8080"
    depends_on:
      lgtm:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build:
      context: ..
      dockerfile: otel/Dockerfile
      args:
        SERVICE_DIR: service-b
    environment:
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      SERVICE_VERSION: dev
      DEPLOY_ENV: local
      REDIS_ADDR: redis:6379
      PORT: "8080"
      PPROF_ADDR: ":6060"
    depends_on:
      lgtm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lgtm-data:

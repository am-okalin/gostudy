apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: otel-demo/order-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: pprof
              containerPort: 6060
          env:
            - name: OTEL_SERVICE_NAME
              value: order-service
            - name: SERVICE_VERSION
              value: dev
            - name: DEPLOY_ENV
              value: kind
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4317
            - name: REDIS_ADDR
              value: redis:6379
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: KAFKA_TOPIC
              value: orders
            - name: INVENTORY_URL
              value: http://inventory-service:8080
            - name: PORT
              value: "8080"
            - name: PPROF_ADDR
              value: :6060
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: demo
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: pprof
      port: 6060
      targetPort: 6060
---
